<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="coachBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="coachGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#coachBg)"/>
  <rect width="800" height="600" fill="url(#coachGrid)"/>

  <!-- Outer Frame -->
  <rect x="50" y="40" width="700" height="520" rx="20" fill="#0B132B" stroke="#334155" stroke-width="2"/>
  <rect x="65" y="55" width="670" height="490" rx="14" fill="#080E1E" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Coaching / Mentorship Graphic -->
  <g transform="translate(400, 185)">
    <!-- Clipboard / Tactical Board -->
    <rect x="-55" y="-55" width="110" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="-25" y="-65" width="50" height="18" rx="4" fill="#34D399"/>
    <circle cx="0" cy="-56" r="4" fill="#0F172A"/>

    <!-- Tactical Drill Lines -->
    <line x1="-35" y1="-25" x2="35" y2="-25" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-35" y1="-5" x2="15" y2="-5" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-35" y1="15" x2="25" y2="15" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <path d="M -20 30 Q 0 45 25 35" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="3,3"/>
    <polygon points="25,35 18,30 20,40" fill="#34D399"/>

    <!-- Coach Whistle Accent -->
    <circle cx="95" cy="5" r="22" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
    <path d="M 85 5 L 105 5 M 95 -5 L 95 15" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34D399" font-weight="600" text-anchor="middle" letter-spacing="4">LEADERSHIP &amp; MENTORSHIP</text>
  <text x="400" y="365" font-family="'Manrope', sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">DOKUMENTASI KEPELATIHAN</text>
  <text x="400" y="400" font-family="'Manrope', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Sesi Pembinaan, Drill Cadence, &amp; Persiapan Kontingen Marching Band</text>

  <!-- Slot Info -->
  <rect x="220" y="435" width="360" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="400" y="462" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399" font-weight="600" text-anchor="middle">SLOT DOKUMENTASI KEPELATIHAN</text>
  <text x="400" y="482" font-family="'Manrope', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Siap diganti dengan foto aktivitas kepelatihan asli (.jpg / .png)</text>
</svg>
