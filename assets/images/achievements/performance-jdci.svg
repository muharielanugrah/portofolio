<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="stadiumSpot" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fieldGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <!-- Stadium Night Sky -->
  <rect width="800" height="600" fill="url(#nightSky)" rx="16"/>
  <rect width="800" height="600" fill="url(#stadiumSpot)" rx="16"/>
  <rect width="796" height="596" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Stadium Floodlights Beams -->
  <polygon points="50,40 180,600 320,600" fill="#38BDF8" fill-opacity="0.08"/>
  <polygon points="750,40 620,600 480,600" fill="#38BDF8" fill-opacity="0.08"/>
  <polygon points="400,20 280,600 520,600" fill="#F8FAFC" fill-opacity="0.06"/>

  <!-- Field Surface with Yard Lines -->
  <polygon points="0,380 800,380 800,600 0,600" fill="url(#fieldGreen)"/>
  <!-- Field Lines -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Yard Line Markers -->
  <line x1="160" y1="380" x2="120" y2="600" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="280" y1="380" x2="260" y2="600" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="400" y1="380" x2="400" y2="600" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5"/>
  <line x1="520" y1="380" x2="540" y2="600" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="640" y1="380" x2="680" y2="600" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Marching Band Silhouettes in Drill Formation -->
  <g fill="#0F172A" stroke="#38BDF8" stroke-width="1.2">
    <!-- Center Snare / Battery Line -->
    <circle cx="340" cy="460" r="9"/>
    <rect x="333" y="470" width="14" height="28" rx="3"/>
    
    <circle cx="370" cy="455" r="9"/>
    <rect x="363" y="465" width="14" height="28" rx="3"/>

    <circle cx="400" cy="450" r="10" stroke="#FCD34D" stroke-width="2"/>
    <rect x="392" y="461" width="16" height="30" rx="3" stroke="#FCD34D" stroke-width="1.5"/>

    <circle cx="430" cy="455" r="9"/>
    <rect x="423" y="465" width="14" height="28" rx="3"/>

    <circle cx="460" cy="460" r="9"/>
    <rect x="453" y="470" width="14" height="28" rx="3"/>

    <!-- Brass / Hornline Wings -->
    <circle cx="240" cy="485" r="8"/>
    <rect x="234" y="494" width="12" height="25" rx="3"/>

    <circle cx="280" cy="475" r="8"/>
    <rect x="274" y="484" width="12" height="25" rx="3"/>

    <circle cx="520" cy="475" r="8"/>
    <rect x="514" y="484" width="12" height="25" rx="3"/>

    <circle cx="560" cy="485" r="8"/>
    <rect x="554" y="494" width="12" height="25" rx="3"/>

    <!-- Color Guard / Flags Silhouette -->
    <g stroke="#EC4899" stroke-width="1.5">
      <circle cx="180" cy="510" r="8"/>
      <rect x="174" y="519" width="12" height="24" rx="3"/>
      <line x1="180" y1="520" x2="160" y2="440" stroke="#F472B6" stroke-width="2"/>
      <polygon points="160,440 210,455 170,480" fill="#EC4899" fill-opacity="0.8"/>

      <circle cx="620" cy="510" r="8"/>
      <rect x="614" y="519" width="12" height="24" rx="3"/>
      <line x1="620" y1="520" x2="640" y2="440" stroke="#F472B6" stroke-width="2"/>
      <polygon points="640,440 590,455 630,480" fill="#EC4899" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Top Title Banner -->
  <g text-anchor="middle" font-family="'Manrope', sans-serif">
    <rect x="190" y="35" width="420" height="42" rx="21" fill="#0A0F1D" stroke="#334155" stroke-width="1.5"/>
    <text x="400" y="61" fill="#F8FAFC" font-size="14" font-weight="700" letter-spacing="1">DOKUMENTASI PENAMPILAN LAPANGAN</text>
    <text x="400" y="100" fill="#38BDF8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600">JAKARTA DRUM CORPS INTERNATIONAL (JDCI)</text>
  </g>

  <!-- Bottom Details -->
  <text x="400" y="580" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
    FORMASI DRILL &amp; ENSEMBLE PERFORMANCE • DOKUMENTASI KEGIATAN KOMPETISI
  </text>
</svg>

