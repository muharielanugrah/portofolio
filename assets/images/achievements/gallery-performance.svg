<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="perfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="perfGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#perfBg)"/>
  <rect width="800" height="600" fill="url(#perfGrid)"/>

  <!-- Outer Frame -->
  <rect x="50" y="40" width="700" height="520" rx="20" fill="#0B132B" stroke="#334155" stroke-width="2"/>
  <rect x="65" y="55" width="670" height="490" rx="14" fill="#080E1E" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Percussion & Performance Graphic -->
  <g transform="translate(400, 185)">
    <!-- Multitom / Tenor Drums Graphic -->
    <ellipse cx="-45" cy="10" rx="28" ry="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <ellipse cx="45" cy="10" rx="28" ry="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <ellipse cx="-85" cy="-10" rx="22" ry="13" fill="#1E293B" stroke="#C084FC" stroke-width="2"/>
    <ellipse cx="85" cy="-10" rx="22" ry="13" fill="#1E293B" stroke="#C084FC" stroke-width="2"/>
    <ellipse cx="0" cy="-20" rx="18" ry="11" fill="#1E293B" stroke="#FCD34D" stroke-width="2"/>

    <!-- Drum Mallets / Sticks Cross -->
    <line x1="-35" y1="-50" x2="35" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="-50" x2="-35" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-35" cy="-50" r="5" fill="#38BDF8"/>
    <circle cx="35" cy="-50" r="5" fill="#38BDF8"/>

    <!-- Musical sound waves -->
    <path d="M -130 -30 Q -150 -10 -130 10" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130 -30 Q 150 -10 130 10" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C084FC" font-weight="600" text-anchor="middle" letter-spacing="4">MULTITOM &amp; ENSEMBLE ARTISTRY</text>
  <text x="400" y="365" font-family="'Manrope', sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">FOTO PENAMPILAN MARCHING BAND</text>
  <text x="400" y="400" font-family="'Manrope', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Aksi Musikalitas Multitom Player &amp; Formasi Visual Lapangan Terbuka</text>

  <!-- Slot Info -->
  <rect x="220" y="435" width="360" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="400" y="462" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C084FC" font-weight="600" text-anchor="middle">SLOT DOKUMENTASI PENAMPILAN</text>
  <text x="400" y="482" font-family="'Manrope', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Siap diganti dengan foto performa aksi asli (.jpg / .png)</text>
</svg>
