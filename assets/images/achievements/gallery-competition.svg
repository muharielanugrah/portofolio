<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#08101E"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="compGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#compBg)"/>
  <rect width="800" height="600" fill="url(#compGrid)"/>

  <!-- Outer Frame -->
  <rect x="50" y="40" width="700" height="520" rx="20" fill="#0B132B" stroke="#334155" stroke-width="2"/>
  <rect x="65" y="55" width="670" height="490" rx="14" fill="#080E1E" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Stadium Arena / Field Graphic -->
  <g transform="translate(400, 180)">
    <!-- Field Perspective -->
    <polygon points="-240,60 240,60 170,-50 -170,-50" fill="#0B172E" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <ellipse cx="0" cy="5" rx="50" ry="20" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Stadium Floodlights -->
    <path d="M -220 -80 L -180 -50" stroke="#FDE047" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M 220 -80 L 180 -50" stroke="#FDE047" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="-220" cy="-80" r="10" fill="#FDE047" fill-opacity="0.4"/>
    <circle cx="220" cy="-80" r="10" fill="#FDE047" fill-opacity="0.4"/>

    <!-- Marching Formation Dots -->
    <circle cx="-90" cy="15" r="5" fill="#38BDF8"/>
    <circle cx="-45" cy="25" r="5" fill="#38BDF8"/>
    <circle cx="0" cy="30" r="6" fill="#FCD34D"/>
    <circle cx="45" cy="25" r="5" fill="#38BDF8"/>
    <circle cx="90" cy="15" r="5" fill="#38BDF8"/>
    <circle cx="-60" cy="-15" r="4" fill="#38BDF8"/>
    <circle cx="0" cy="-20" r="5" fill="#38BDF8"/>
    <circle cx="60" cy="-15" r="4" fill="#38BDF8"/>
  </g>

  <!-- Typography -->
  <text x="400" y="320" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8" font-weight="600" text-anchor="middle" letter-spacing="4">COMPETITION ARENA &amp; PARADE</text>
  <text x="400" y="360" font-family="'Manrope', sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">FOTO DOKUMENTASI KOMPETISI</text>
  <text x="400" y="395" font-family="'Manrope', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Momen Kejuaraan: Field Show, Display, Street Parade, &amp; Drum Battle</text>

  <!-- Slot Info -->
  <rect x="220" y="430" width="360" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="400" y="457" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" font-weight="600" text-anchor="middle">SLOT DOKUMENTASI KOMPETISI</text>
  <text x="400" y="477" font-family="'Manrope', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Siap diganti dengan foto aksi panggung kompetisi asli (.jpg / .png)</text>
</svg>
